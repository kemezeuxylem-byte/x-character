<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X-Character Prompt Creator</title>
<meta name="description" content="Answer step-by-step questions in French or English about a character, then copy a ready-made prompt for any AI image tool.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EDEFF8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12142F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X-Character">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=DM+Mono:wght@400;500&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: an artist's mannequin on a head-height ruler stays in view and reacts to the answers; questions sit beside it, the prompt writes itself on the right. */
:root {
  --paper: #EDEFF8;
  --surface: #F9FAFE;
  --ink: #1B1E4B;
  --muted: #535783;
  --line: #C6CAE2;
  --accent: #F4B223;
  --on-accent: #1B1E4B;
  --primary: #2A2F8F;
  --on-primary: #FFFFFF;
  --fig: #C3C7E3;
  --fig-line: #2A2F8F;
  --display: "Bricolage Grotesque", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", Verdana, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12142F; --surface: #1B1E42; --ink: #ECEDFA; --muted: #A9ACD3; --line: #383C6E;
    --accent: #F4B223; --on-accent: #1B1E4B; --primary: #F4B223; --on-primary: #14163A;
    --fig: #4B4F8A; --fig-line: #C8CBF2; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12142F; --surface: #1B1E42; --ink: #ECEDFA; --muted: #A9ACD3; --line: #383C6E;
  --accent: #F4B223; --on-accent: #1B1E4B; --primary: #F4B223; --on-primary: #14163A;
  --fig: #4B4F8A; --fig-line: #C8CBF2; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font: 400 1rem/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 48px;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
.app { max-width: 1320px; margin-inline: auto; display: grid; gap: 20px; }

/* Header */
.top { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; justify-content: space-between; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
.brand { font: 800 1.35rem/1.1 var(--display); font-stretch: 80%; letter-spacing: -.01em; margin: 0; }
.top-right { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.count { font: 400 .8rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.btn { border: 1.5px solid var(--ink); background: transparent; border-radius: 7px; padding: .45rem .8rem; font-weight: 700; font-size: .9rem; cursor: pointer; min-height: 38px; }
.btn:hover { background: var(--surface); }
.btn.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.primary:hover { filter: brightness(1.12); background: var(--primary); }
.btn.quiet { border-color: var(--line); font-weight: 400; }
.lang { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 7px; overflow: hidden; }
.lang button { background: transparent; border: 0; padding: .35rem .65rem; min-height: 36px; font: 500 .8rem var(--mono); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.lang button:focus-visible { outline-offset: -3px; }

/* Three columns */
.layout { display: grid; grid-template-columns: 240px minmax(0, 1fr) 350px; gap: 32px; align-items: start; }
.layout.no-panel { grid-template-columns: 240px minmax(0, 1fr); }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 14px; max-height: calc(100vh - 32px); overflow-y: auto; min-width: 0; }
.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100vh - 32px); min-width: 0; }
main { min-width: 0; }

/* Mannequin */
#fig { display: block; width: 100%; height: clamp(220px, 40vh, 340px); cursor: pointer; overflow: hidden; }
#fig .f { stroke: var(--skin, var(--fig)); fill: none; stroke-linecap: round; }
#fig .o { stroke: var(--fig-line); fill: none; stroke-linecap: round; transition: stroke .25s; }
#fig .j { fill: var(--skin, var(--fig)); stroke: var(--fig-line); stroke-width: 1.5; transition: stroke .25s, fill .25s; }
#fig .hair { fill: var(--hair, var(--fig-line)); stroke: none; }
#fig .feat { fill: none; stroke: var(--fig-line); stroke-width: 1; stroke-linecap: round; }
#fig .iris { fill: var(--eye, var(--fig-line)); stroke: none; transition: fill .25s; }
#fig .tick { stroke: var(--line); stroke-width: 1; }
#fig .rule-text { font: 400 12px var(--mono); fill: var(--muted); }
#ruler { transition: opacity .3s; }
#figZoom, #figH, #figB { transition: transform .6s cubic-bezier(.3, .8, .3, 1); }
#figH { transform-origin: 120px 420px; }
#figB { transform-origin: 120px 0; }
#fig[data-z="body"] .z-body .o, #fig[data-z="all"] .o { stroke: var(--accent); }
#fig[data-z="body"] .z-body .j, #fig[data-z="all"] .j, #fig[data-z="face"] .head { stroke: var(--accent); stroke-width: 2.5; }
#fig[data-z="eyes"] .z-eyes .feat, #fig[data-z="mouth"] .z-mouth .feat { stroke: var(--accent); stroke-width: 1.6; }
#fig[data-z="hair"] .hair { stroke: var(--accent); stroke-width: 1; }
.rail { display: grid; gap: 2px; }
.rail button { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; width: 100%; text-align: left; background: transparent; border: 0; border-radius: 6px; padding: .3rem .55rem; cursor: pointer; font-size: .92rem; color: var(--ink); white-space: nowrap; }
.rail button:hover { background: var(--surface); }
.rail button[aria-current="step"] { background: var(--ink); color: var(--paper); font-weight: 700; }
.rail .n { font: 400 .72rem var(--mono); opacity: .75; font-variant-numeric: tabular-nums; }

/* Questions */
.eyebrow { font: 500 .75rem var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
h1 { font: 800 clamp(1.8rem, 3.6vw, 2.7rem)/1.05 var(--display); font-stretch: 82%; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.hint { color: var(--muted); margin: 8px 0 0; max-width: 62ch; }
.fields { display: grid; gap: 22px; margin-top: 24px; }
.field { display: grid; gap: 8px; min-width: 0; }
.field-head { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; }
.field-label { font-weight: 700; }
.field-mode { font: 400 .7rem var(--mono); color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: .38rem .66rem; min-height: 38px; cursor: pointer; font-size: .94rem; line-height: 1.2; text-align: left; }
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip[aria-pressed="true"]::before { content: "\2713"; font-weight: 700; }
.chip.own { border-style: dashed; background: transparent; color: var(--muted); }
.chip.own[aria-expanded="true"] { border-style: solid; color: var(--ink); }
.dot { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
input[type="text"], input[type="number"] { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: .5rem .66rem; min-height: 40px; width: 100%; max-width: 30rem; }
input::placeholder { color: var(--muted); opacity: .85; }
.age-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.age-row input[type="range"] { flex: 1 1 200px; min-width: 0; accent-color: var(--primary); }
.age-row input[type="number"] { width: 5.5rem; flex: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: .85rem; }
.note { font-size: .9rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; margin: 0; max-width: 62ch; }
.step-nav { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); }

/* Prompt panel */
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.panel-title { font: 700 1rem var(--display); margin: 0; display: flex; align-items: center; gap: 8px; }
.tag { font: 500 .66rem var(--mono); letter-spacing: .05em; text-transform: uppercase; background: var(--accent); color: var(--on-accent); padding: 2px 6px; border-radius: 4px; }
.prompt-text { font: 400 .8rem/1.55 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; padding: 12px; overflow-y: auto; min-height: 120px; }
.panel-foot { padding: 10px 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.words { font: 400 .72rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

/* Final step */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 20px; }
.help { font-size: .9rem; color: var(--muted); margin: 10px 0 0; }
.out-label { display: block; font-weight: 700; margin: 16px 0 6px; }
textarea { display: block; width: 100%; background: var(--surface); border: 1.5px solid var(--ink); border-radius: 10px; padding: 14px; font: 400 .88rem/1.6 var(--mono); resize: vertical; }
.copy-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 10px; }
.copy-row .btn.primary { font-size: 1rem; padding: .6rem 1.1rem; min-height: 44px; }
.missing { margin-top: 26px; }
.missing h2 { font: 700 1.1rem var(--display); margin: 0 0 4px; }

@media (max-width: 1180px) {
  .layout, .layout.no-panel { grid-template-columns: 220px minmax(0, 1fr); gap: 24px; }
  .panel { grid-column: 2; position: static; max-height: none; }
  .prompt-text { max-height: 340px; }
}
@media (max-width: 760px) {
  .layout, .layout.no-panel { grid-template-columns: minmax(0, 1fr); }
  .panel { grid-column: 1; }
  .stage { position: static; grid-template-columns: 74px minmax(0, 1fr); align-items: center; max-height: none; overflow: visible; }
  #fig { height: 148px; }
  #ruler { display: none; }
  .rail { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .rail button { width: auto; flex: none; }
  .rail .n { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #figZoom, #figH, #figB, #ruler { transition: none; }
}

/* Passcode lock */
html:not(.xc-ok) .app { display: none !important; }
.xc-lock { max-width: 580px; margin: 5vh auto 0; }
.xc-card { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 12px; padding: 22px; display: grid; gap: 18px; }
.xc-top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.xc-card h1 { font-size: clamp(1.7rem, 6vw, 2.3rem); }
.xc-card .hint { margin: 0; }
.xc-dev { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.xc-dev code { font: 500 1.6rem var(--mono); letter-spacing: .08em; background: var(--paper); border: 1.5px dashed var(--line); border-radius: 8px; padding: .3rem .75rem; user-select: all; }
.xc-row { display: flex; flex-wrap: wrap; gap: 8px; }
.xc-row input[type="text"] { flex: 1 1 230px; max-width: none; min-width: 0; font: 500 1.15rem var(--mono); letter-spacing: .05em; text-transform: uppercase; min-height: 46px; }
.xc-row .btn { min-height: 46px; }
.xc-msg { margin: 0; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--paper); font-weight: 700; }
.xc-field { display: grid; gap: 8px; }
</style>
</head>
<body>
<section id="xcLock" class="xc-lock" hidden aria-labelledby="xcTitle">
  <div class="xc-card">
    <div class="xc-top">
      <p class="brand">X-Character Prompt Creator</p>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" id="xcLang-en" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="xcLang-fr" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
    <h1 id="xcTitle">Enter your access code</h1>
    <p class="hint" id="xcIntro"></p>
    <p class="xc-msg" id="xcMsg" role="alert" hidden></p>
    <div class="xc-field"><span class="field-label" id="xcDevLabel"></span>
      <div class="xc-dev"><code id="xcDevice"></code><button class="btn" type="button" id="xcCopyDev"></button></div></div>
    <form id="xcForm" class="xc-field" novalidate>
      <label class="field-label" for="xcCode" id="xcCodeLabel"></label>
      <div class="xc-row"><input type="text" id="xcCode" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXX-XXXXX-XXXXX"><button class="btn primary" type="submit" id="xcUnlock"></button></div>
    </form>
    <p class="help" id="xcNote" style="margin:0"></p>
  </div>
</section>
<div class="app">
  <header class="top">
    <p class="brand">X-Character Prompt Creator</p>
    <div class="top-right">
      <span class="count" id="count"></span>
      <button class="btn primary" type="button" id="install" hidden>Install app</button>
      <button class="btn quiet" type="button" id="surprise">Surprise me</button>
      <button class="btn quiet" type="button" id="reset">Start over</button>
      <div class="lang" role="group" aria-label="Language / Langue">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-fr" data-lang="fr" aria-pressed="false">FR</button>
      </div>
    </div>
  </header>
  <p class="note" id="iosTip" hidden></p>
  <div class="layout" id="layout">
    <aside class="stage">
      <svg id="fig" viewBox="0 0 220 440" aria-hidden="true"></svg>
      <nav class="rail" id="rail" aria-label="Question sections"></nav>
    </aside>
    <main id="main"></main>
    <section class="panel" id="panel" aria-label="Prompt so far">
      <div class="panel-head">
        <h2 class="panel-title">Prompt so far <span class="tag" id="exTag">Example</span></h2>
        <button class="btn quiet" type="button" id="panelCopy">Copy</button>
      </div>
      <pre class="prompt-text" id="panelText"></pre>
      <div class="panel-foot">
        <span class="words" id="panelWords"></span>
        <button class="link-btn" type="button" id="useExample">Fill the form with this example</button>
      </div>
    </section>
  </div>
</div>
<datalist id="countries"></datalist>
<datalist id="jobs"></datalist>
<div id="live" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>

  $("#panel").setAttribute("aria-label", t("panel"));
  $("#rail").setAttribute("aria-label", t("nav"));
  ["en", "fr"].forEach(l => $("#lang-" + l).setAttribute("aria-pressed", String(S.lang === l)));
}
function changed() { save(); syncFields(); refresh(); }
function goStep(i, focusTop) {
  S.step = Math.max(0, Math.min(STEPS.length - 1, i));
  save(); renderStep();
  if (focusTop) window.scrollTo({top: 0});
}

/* Copy */
function flash(btn, msg) {
  const old = btn.dataset.label || btn.textContent;
  btn.dataset.label = old;
  btn.textContent = msg;
  $("#live").textContent = msg;
  clearTimeout(btn._t);
  btn._t = setTimeout(() => { btn.textContent = old; }, 1800);
}
function selectEl(el) {
  if (el.select) { el.focus(); el.select(); return; }
  const r = document.createRange(); r.selectNodeContents(el);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}
function copy(value, btn, el) {
  const fail = () => { selectEl(el); flash(btn, t("selected")); };
  if (!navigator.clipboard) return fail();
  navigator.clipboard.writeText(value).then(() => flash(btn, t("copied")), fail);
}

/* Events */
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go-step]");
  if (go) return goStep(+go.dataset.goStep, true);
  const chip = e.target.closest("[data-f]");
  if (chip) {
    const f = F[chip.dataset.f], o = f.opts[+chip.dataset.i];
    if (f.type === "one") {
      S.a[f.id] = S.a[f.id] === o.l && !(S.c[f.id] || "").trim() ? undefined : o.l;
      S.c[f.id] = "";
      const inp = document.getElementById("c-" + f.id);
      if (inp) inp.value = "";
    } else {
      const list = S.a[f.id] || [];
      S.a[f.id] = list.includes(o.l) ? list.filter(x => x !== o.l) : list.concat(o.l);
    }
    if (f.id === "sex") updateLists();
    return changed();
  }
  const langBtn = e.target.closest("[data-lang]");
  if (langBtn) {
    S.lang = langBtn.dataset.lang; S.plang = S.lang;
    save(); updateLists(); setChrome(); renderStep();
    return;
  }
  const plang = e.target.closest("[data-plang]");
  if (plang) { S.plang = plang.dataset.plang; save(); fillFinal(); refresh(); return; }
  const own = e.target.closest("[data-own]");
  if (own) {
    const inp = document.getElementById("c-" + own.dataset.own);
    const open = inp.hidden;
    inp.hidden = !open;
    own.setAttribute("aria-expanded", String(open));
    if (open) inp.focus();
    else { S.c[own.dataset.own] = ""; inp.value = ""; changed(); }
    return;
  }
  const fmt = e.target.closest("[data-fmt]");
  if (fmt) { S.fmt = fmt.dataset.fmt; save(); fillFinal(); refresh(); return; }
  if (e.target.id === "ageClear") {
    delete S.a.age; $("#ageNum").value = ""; $("#ageRange").value = 30; return changed();
  }
  if (e.target.id === "copyOut") return copy($("#out").value, e.target, $("#out"));
  if (e.target.id === "copyNeg") return copy($("#neg").value, e.target, $("#neg"));
  if (e.target.id === "panelCopy") return copy($("#panelText").textContent, e.target, $("#panelText"));
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.text) { S.a[el.dataset.text] = el.value; return changedQuiet(); }
  if (el.dataset.custom) {
    const f = F[el.dataset.custom];
    S.c[f.id] = el.value;
    if (f.type === "one" && el.value.trim()) S.a[f.id] = undefined;
    return changed();
  }
  if (el.id === "ageRange") { S.a.age = +el.value; $("#ageNum").value = el.value; return changed(); }
  if (el.id === "ageNum") {
    const n = parseInt(el.value, 10);
    if (isNaN(n) || n < 1) delete S.a.age;
    else { S.a.age = Math.min(n, 120); $("#ageRange").value = Math.min(n, 100); }
    return changed();
  }
  if (el.id === "out") $("#outWords").textContent = words(el.value) + " " + t("words");
});
function changedQuiet() { save(); refresh(); }
$("#fig").addEventListener("click", e => {
  const z = e.target.closest("[data-go]");
  if (!z) return;
  const i = STEPS.findIndex(s => s.id === z.dataset.go);
  if (i >= 0) goStep(i, false);
});
$("#useExample").addEventListener("click", () => {
  S.a = JSON.parse(JSON.stringify(EXAMPLE.a)); S.c = {};
  save(); renderStep();
});
const resetBtn = $("#reset");
resetBtn.addEventListener("click", () => {
  if (resetBtn.dataset.armed) {
    delete resetBtn.dataset.armed;
    resetBtn.textContent = t("reset");
    S.a = {}; S.c = {}; S.step = 0;
    updateLists();
    save(); renderStep(); window.scrollTo({top: 0});
    return;
  }
  resetBtn.dataset.armed = "1";
  resetBtn.textContent = t("resetArm");
  setTimeout(() => { delete resetBtn.dataset.armed; resetBtn.textContent = t("reset"); }, 3500);
});
const pick = l => l[Math.floor(Math.random() * l.length)];
$("#surprise").addEventListener("click", () => {
  const a = {}; S.c = {};
  a.sex = pick(["Female", "Male"]);
  a.age = 18 + Math.floor(Math.random() * 60);
  a.origin = pick(COUNTRIES);
  a.job = pick(JOBS.filter(j => j !== "student"));
  a.era = "Present day";
  const skip = new Set(["sex","pres","era","diff","series","chest","facialHair","eyewear","headwear","tattoos","hairStyle","nostrils","lipColor","noseSize","eyeSize"]);
  FLAT.forEach(f => {
    if (!f.opts || skip.has(f.id)) return;
    if (f.type === "one" && Math.random() < .82) a[f.id] = pick(f.opts).l;
    if (f.type === "many" && Math.random() < .55) {
      const n = 1 + Math.floor(Math.random() * 2);
      a[f.id] = Array.from(new Set(Array.from({length: n}, () => pick(f.opts).l)));
    }
  });
  a.chest = a.sex === "Male" ? pick(["Narrow", "Average", "Broad", "Barrel"]) : pick(["Small bust", "Medium bust", "Full bust"]);
  if (a.sex === "Male" && Math.random() < .6) a.facialHair = pick(F.facialHair.opts).l;
  if (a.age > 60) a.hairCol = pick(["Grey", "White", "Salt and pepper"]);
  a.hairLen = a.hairLen || "Short";
  const shortStyles = ["Afro", "Fade", "Twists", "Slicked back", "Loose and natural"], longStyles = ["Loose and natural", "Box braids", "Cornrows", "Locs", "Twists", "Ponytail", "Bun", "Top knot"];
  if (a.hairLen !== "Bald" && a.hairLen !== "Buzz cut") a.hairStyle = pick(a.hairLen === "Short" ? shortStyles : longStyles);
  if (a.hairStyle === "Afro" || a.hairStyle === "Bantu knots") a.hairTex = "Coily";
  if (a.hairLen === "Buzz cut") delete a.hairTex;
  a.art = Math.random() < .7 ? "Photorealistic photo" : a.art;
  a.frame = "Full body";
  a.aspect = "2:3 Portrait";
  S.a = a;
  updateLists();
  goStep(STEPS.length - 1, true);
});

/* Boot */
updateLists();
setChrome();
renderStep();
</script>
<script>
/* Install button and offline support */
const INSTALL_T = {
  en: {btn: "Install app", ios: "To install on iPhone or iPad, open this page in Safari, tap Share, then tap Add to Home Screen."},
  fr: {btn: "Installer l'application", ios: "Pour l'installer sur iPhone ou iPad, ouvrez cette page dans Safari, appuyez sur Partager, puis sur Sur l'écran d'accueil."},
};
(function () {
  const btn = document.getElementById("install"), tip = document.getElementById("iosTip");
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  let promptEvent = null;
  function setText() { btn.textContent = INSTALL_T[S.lang].btn; tip.textContent = INSTALL_T[S.lang].ios; }
  setText();
  document.addEventListener("click", e => { if (e.target.closest("[data-lang]")) setText(); });
  if (ios && !installed) btn.hidden = false;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); promptEvent = e; if (!installed) btn.hidden = false; });
  addEventListener("appinstalled", () => { btn.hidden = true; tip.hidden = true; promptEvent = null; });
  btn.addEventListener("click", async () => {
    if (!promptEvent) { tip.hidden = !tip.hidden; return; }
    promptEvent.prompt();
    await promptEvent.userChoice;
    promptEvent = null;
    btn.hidden = true;
  });
  if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
<script>
/* Access codes for X-Character Prompt Creator. Shared by the app and the Code Maker. */
const XC_SECRET = "63456cc130bfa87429f3e347a70f1930e187976fac206bee18ee4d0544e5134c";
const XC_B32 = "0123456789ABCDEFGHJKMNPQRSTVWXYZ";
const XC_EPOCH = Date.UTC(2026, 0, 1);
const XC_DAY = 86400000;
const XC_ENTER_DAYS = 7;
function xcEnc(bytes) {
  let bits = 0, val = 0, out = "";
  for (const b of bytes) {
    val = ((val << 8) | b) & 0xffff; bits += 8;
    while (bits >= 5) { out += XC_B32[(val >>> (bits - 5)) & 31]; bits -= 5; }
  }
  if (bits > 0) out += XC_B32[(val << (5 - bits)) & 31];
  return out;
}
function xcDec(str) {
  let bits = 0, val = 0; const out = [];
  for (const ch of str) {
    const i = XC_B32.indexOf(ch);
    if (i < 0) return null;
    val = ((val << 5) | i) & 0xffff; bits += 5;
    if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; }
  }
  return out;
}
function xcNorm(s) { return String(s || "").toUpperCase().replace(/[^0-9A-Z]/g, "").replace(/O/g, "0").replace(/[IL]/g, "1"); }
function xcGroup(s, n) { return s.match(new RegExp(".{1," + n + "}", "g")).join("-"); }
let xcKeyPromise = null;
async function xcSig(device, payload) {
  if (!xcKeyPromise) {
    const raw = new Uint8Array(XC_SECRET.match(/../g).map(h => parseInt(h, 16)));
    xcKeyPromise = crypto.subtle.importKey("raw", raw, {name: "HMAC", hash: "SHA-256"}, false, ["sign"]);
  }
  const msg = new TextEncoder().encode("XC1|" + device + "|" + payload.join(","));
  const s = new Uint8Array(await crypto.subtle.sign("HMAC", await xcKeyPromise, msg));
  return Array.from(s.slice(0, 5));
}
/* days: 1 to 255, or 0 for no end date */
async function xcMakeCode(device, createdMs, days) {
  const d = Math.floor((createdMs - XC_EPOCH) / XC_DAY);
  const nonce = crypto.getRandomValues(new Uint8Array(1))[0];
  const p = [(d >> 8) & 255, d & 255, days & 255, nonce];
  return xcGroup(xcEnc(p.concat(await xcSig(device, p))), 5);
}
async function xcReadCode(device, code) {
  const c = xcNorm(code);
  if (c.length !== 15) return null;
  const bytes = xcDec(c);
  if (!bytes || bytes.length < 9) return null;
  const p = bytes.slice(0, 4), sig = await xcSig(device, p);
  if (sig.some((v, i) => v !== bytes[4 + i])) return null;
  return {created: XC_EPOCH + ((p[0] << 8) | p[1]) * XC_DAY, days: p[2]};
}

/* Passcode lock. Each code works on one device, for its number of days from the moment it is entered. */
(function () {
  const KEY = "x-character-access-v1";
  const TXT = {
    en: {title: "Enter your access code", expiredTitle: "Your access has ended",
      intro: "X-Character Prompt Creator is private. To get an access code, send your device number to the app owner.",
      devLabel: "Your device number", copy: "Copy", copied: "Copied", select: "Selected. Copy it from your device",
      codeLabel: "Access code", unlock: "Unlock", checking: "Checking…",
      note: "Each code works only on this device. If you clear this app's data or switch browsers, you will get a new device number and need a new code.",
      invalid: "This code doesn't work on this device. Check the code, and check that it was made for the device number above.",
      late: "This code was not entered within 7 days, so it can no longer be used. Ask the app owner for a new code.",
      expired: d => `Your access ended on ${d}. Send your device number to the app owner to get a new code.`,
      empty: "Type your access code first.",
      badge: d => `Access until ${d}`},
    fr: {title: "Entrez votre code d'accès", expiredTitle: "Votre accès est terminé",
      intro: "X-Character Prompt Creator est privé. Pour obtenir un code d'accès, envoyez le numéro de votre appareil au propriétaire de l'application.",
      devLabel: "Numéro de votre appareil", copy: "Copier", copied: "Copié", select: "Sélectionné. Copiez-le depuis votre appareil",
      codeLabel: "Code d'accès", unlock: "Déverrouiller", checking: "Vérification…",
      note: "Chaque code ne fonctionne que sur cet appareil. Si vous effacez les données de l'application ou changez de navigateur, vous aurez un nouveau numéro d'appareil et il vous faudra un nouveau code.",
      invalid: "Ce code ne fonctionne pas sur cet appareil. Vérifiez le code, et vérifiez qu'il a été créé pour le numéro d'appareil ci-dessus.",
      late: "Ce code n'a pas été saisi dans les 7 jours, il ne peut donc plus être utilisé. Demandez un nouveau code au propriétaire de l'application.",
      expired: d => `Votre accès a pris fin le ${d}. Envoyez le numéro de votre appareil au propriétaire de l'application pour obtenir un nouveau code.`,
      empty: "Saisissez d'abord votre code d'accès.",
      badge: d => `Accès jusqu'au ${d}`},
  };
  const lang = () => (typeof S !== "undefined" && S.lang === "fr") ? "fr" : "en";
  const tx = k => TXT[lang()][k];
  const fmt = ms => new Date(ms).toLocaleDateString(lang() === "fr" ? "fr-FR" : "en-GB", {day: "numeric", month: "long", year: "numeric"});

  let A = {};
  try { A = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  if (!A.device) A.device = xcEnc(Array.from(crypto.getRandomValues(new Uint8Array(5)))).slice(0, 8);
  A.codes = A.codes || {};
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(A)); } catch (e) {} };
  store();

  /* The clock never goes backwards: the latest time seen, or the web server's time, wins over the device clock. */
  let serverNow = 0, serverAt = 0;
  function now() {
    let t = Date.now();
    if (serverNow) t = Math.max(t, serverNow + (performance.now() - serverAt));
    t = Math.max(t, A.lastSeen || 0);
    A.lastSeen = t; store();
    return t;
  }
  async function syncTime() {
    try {
      const r = await fetch("manifest.webmanifest?now=" + Date.now(), {cache: "no-store"});
      const d = Date.parse(r.headers.get("Date") || "");
      if (!isNaN(d)) { serverNow = d + (parseInt(r.headers.get("Age") || "0", 10) || 0) * 1000; serverAt = performance.now(); }
    } catch (e) {}
  }
  function state() {
    const rec = A.active && A.codes[A.active];
    if (!rec) return {ok: false};
    if (!rec.days) return {ok: true, end: 0};
    const end = rec.activatedAt + rec.days * XC_DAY;
    return now() < end ? {ok: true, end} : {ok: false, expired: end};
  }

  /* Screen */
  const lock = document.getElementById("xcLock");
  const badge = document.createElement("span");
  badge.className = "count"; badge.id = "xcBadge";
  const topRight = document.querySelector(".top-right");
  if (topRight) topRight.prepend(badge);
  let msg = "";
  function render(st) {
    const dev = xcGroup(A.device, 4);
    document.getElementById("xcTitle").textContent = st.expired ? tx("expiredTitle") : tx("title");
    document.getElementById("xcIntro").textContent = tx("intro");
    document.getElementById("xcDevLabel").textContent = tx("devLabel");
    document.getElementById("xcDevice").textContent = dev;
    document.getElementById("xcCopyDev").textContent = tx("copy");
    document.getElementById("xcCodeLabel").textContent = tx("codeLabel");
    document.getElementById("xcUnlock").textContent = tx("unlock");
    document.getElementById("xcNote").textContent = tx("note");
    const m = document.getElementById("xcMsg");
    const text = msg ? tx(msg) : st.expired ? tx("expired")(fmt(st.expired)) : "";
    m.textContent = text; m.hidden = !text;
    ["en", "fr"].forEach(l => document.getElementById("xcLang-" + l).setAttribute("aria-pressed", String(lang() === l)));
    badge.textContent = st.ok && st.end ? tx("badge")(fmt(st.end)) : "";
    badge.hidden = !(st.ok && st.end);
  }
  function apply() {
    const st = state();
    document.documentElement.classList.toggle("xc-ok", st.ok);
    lock.hidden = st.ok;
    render(st);
  }
  async function enter(code) {
    if (!xcNorm(code)) return "empty";
    const info = await xcReadCode(A.device, code);
    if (!info) return "invalid";
    const key = xcNorm(code), t = now();
    if (!A.codes[key]) {
      if (t > info.created + (XC_ENTER_DAYS + 1) * XC_DAY) return "late";
      A.codes[key] = {activatedAt: t, days: info.days};
    }
    A.active = key; store();
    return "";
  }

  document.getElementById("xcForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("xcUnlock"), input = document.getElementById("xcCode");
    btn.disabled = true; btn.textContent = tx("checking");
    msg = await enter(input.value);
    btn.disabled = false;
    apply();
    if (!lock.hidden) { input.focus(); }
    else { input.value = ""; window.scrollTo({top: 0}); }
  });
  document.getElementById("xcCopyDev").addEventListener("click", e => {
    const btn = e.currentTarget, el = document.getElementById("xcDevice"), done = label => { btn.textContent = label; setTimeout(() => { btn.textContent = tx("copy"); }, 1600); };
    const fail = () => { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); done(tx("select")); };
    if (!navigator.clipboard) return fail();
    navigator.clipboard.writeText(xcGroup(A.device, 4)).then(() => done(tx("copied")), fail);
  });
  document.addEventListener("click", e => { if (e.target.closest("[data-lang]")) setTimeout(() => render(state()), 0); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) apply(); });
  setInterval(apply, 60000);
  apply();
  syncTime().then(apply);
})();
</script>
